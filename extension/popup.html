<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="toolbarTitle">Blocking settings</title>
  <link rel="stylesheet" href="popup.css">
  <script src="i18n.js" defer></script>
  <script src="analytics.js" defer></script>
  <script src="popup.js" defer></script>
</head>
<body>
  <header class="brand">
    <img class="brand-icon" src="icons/icon-32.png" width="32" height="32" alt="">
    <span class="brand-name" data-i18n="appName">Short Video Blocker</span>
    <span class="brand-detail" aria-hidden="true"></span>
  </header>
  <main>
    <div class="intro">
      <h1 data-i18n="popupTitle">Your feed. Your choice.</h1>
      <p data-i18n="popupSubtitle">Choose what to hide on Facebook and YouTube.</p>
    </div>
    <fieldset disabled>
      <legend data-i18n="blockLegend">Hide distractions</legend>
      <div class="settings-list">
        <label class="setting" for="blockVideos">
          <span class="setting-icon video-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="5" width="18" height="14" rx="4"/><path d="m10 9 5 3-5 3Z"/></svg></span>
          <span class="setting-copy"><span id="videos-label" data-i18n="facebookVideos">Facebook videos</span><small id="videos-detail" data-i18n="facebookVideosDetail">Including Reels and live streams</small></span>
          <input type="checkbox" id="blockVideos" role="switch" aria-labelledby="videos-label" aria-describedby="videos-detail">
        </label>
        <label class="setting" for="blockImages">
          <span class="setting-icon image-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m4 18 5-5 3 3 3-4 5 6"/></svg></span>
          <span class="setting-copy"><span id="images-label" data-i18n="facebookImages">Facebook images</span><small id="images-detail" data-i18n="facebookImagesDetail">Post text stays visible</small></span>
          <input type="checkbox" id="blockImages" role="switch" aria-labelledby="images-label" aria-describedby="images-detail">
        </label>
        <label class="setting" for="blockShorts">
          <span class="setting-icon shorts-icon" aria-hidden="true"><svg viewBox="0 0 24 24" focusable="false"><rect x="6" y="5" width="12" height="14" rx="3"/><path d="M9 2h6M9 22h6m-4-13 4 3-4 3Z"/></svg></span>
          <span class="setting-copy"><span id="shorts-label" data-i18n="youtubeShorts">YouTube Shorts</span><small id="shorts-detail" data-i18n="youtubeShortsDetail">Regular videos keep working</small></span>
          <input type="checkbox" id="blockShorts" role="switch" aria-labelledby="shorts-label" aria-describedby="shorts-detail">
        </label>
      </div>
    </fieldset>
  </main>
  <footer>
    <div class="footer-row"><p id="status" role="status" aria-live="polite" data-i18n="loadingSettings">Loading settings…</p><button class="open-settings" type="button" aria-expanded="false" aria-controls="analytics-settings" data-i18n="settingsButton">Settings</button></div>
    <section id="analytics-settings" hidden>
      <label class="analytics-preference"><input class="analytics-consent" type="checkbox" checked data-i18n-aria-label="analyticsConsent"><span data-i18n="analyticsConsent">Share anonymous usage to improve the app</span></label>
      <p class="analytics-details" data-i18n="analyticsDetails">You can turn this off. No page content or browsing history.</p>
    </section>
  </footer>
</body>
</html>
