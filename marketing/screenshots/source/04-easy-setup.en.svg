<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="frame-title frame-description">
<title id="frame-title">We’ll guide you. One step at a time.</title>
<desc id="frame-description">Short Video Blocker for Safari. Frame 2 of two. Product UI reconstructed from the current repository. Editorial framing and shadows are not app controls. Setup requires the user to enable the extension and allow website access.</desc>
<defs>
  <linearGradient id="violetCanvas" x1="0" y1=".1" x2="1" y2=".85"><stop stop-color="#24113f"/><stop offset=".5" stop-color="#492179"/><stop offset="1" stop-color="#8250e5"/></linearGradient>
  <radialGradient id="mintGlow"><stop stop-color="#c9ffde" stop-opacity=".45"/><stop offset=".72" stop-color="#b9ffd6" stop-opacity=".17"/><stop offset="1" stop-color="#b9ffd6" stop-opacity="0"/></radialGradient>
  <linearGradient id="mintCanvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9ffed"/><stop offset=".5" stop-color="#d5f3df"/><stop offset="1" stop-color="#b6e5cf"/></linearGradient>
  <linearGradient id="violetStage" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8550e9"/><stop offset=".55" stop-color="#6431be"/><stop offset="1" stop-color="#44206e"/></linearGradient>
  <linearGradient id="card" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#e2eee4"/><stop offset=".5" stop-color="#faf8f4"/><stop offset="1" stop-color="#e6ddfa"/></linearGradient>
  <linearGradient id="button" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#6044ad"/><stop offset="1" stop-color="#7750ba"/></linearGradient>
  <filter id="shadow" x="-40%" y="-35%" width="180%" height="190%"><feDropShadow dx="0" dy="22" stdDeviation="16" flood-color="#19072d" flood-opacity=".24"/><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#19072d" flood-opacity=".12"/></filter>
</defs>
<g font-family="Arial, Helvetica, sans-serif">
<rect x="0" y="0" width="1440" height="900" rx="0" fill="url(#mintCanvas)" /><ellipse cx="1260" cy="590" rx="420" ry="465" fill="url(#violetStage)"/><ellipse cx="1260" cy="590" rx="364" ry="407" fill="none" stroke="#dac5ff" stroke-opacity=".22" stroke-width="2"/>
<g id="brand"><image href="../../icon/ShortVideoBlocker-icon.png" x="76" y="47" width="54" height="54"/><text data-copy-key="appName" text-anchor="start" font-size="24" font-weight="700" fill="#29243e"><tspan x="145" y="82">Short Video Blocker</tspan></text><text data-copy-key="platform" text-anchor="end" font-size="14" font-weight="600" fill="#655e72"><tspan x="1360" y="80">FOR SAFARI ON MAC</tspan></text></g>
<text data-copy-key="04.headline.0" text-anchor="start" font-size="76" font-weight="700" fill="#29243e"><tspan x="80" y="242">We’ll guide you.</tspan></text><text data-copy-key="04.headline.1" text-anchor="start" font-size="72" font-weight="700" fill="#6044ad"><tspan x="80" y="332">One step at a time.</tspan></text><path d="M104 509V691" fill="none" stroke="#9dc8af" stroke-width="3"/><circle cx="104" cy="505" r="23" fill="#6044ad"/><text text-anchor="middle" font-size="19" font-weight="700" fill="#e3ffed"><tspan x="104" y="512">1</tspan></text><text data-copy-key="04.stepOneTitle" text-anchor="start" font-size="24" font-weight="700" fill="#29243e"><tspan x="148" y="508">We open Safari settings.</tspan></text><text data-copy-key="04.stepOneBody" text-anchor="start" font-size="21" font-weight="400" fill="#466453"><tspan x="148" y="539">Straight to Extensions.</tspan></text><circle cx="104" cy="598" r="23" fill="#6044ad"/><text text-anchor="middle" font-size="19" font-weight="700" fill="#e3ffed"><tspan x="104" y="605">2</tspan></text><text data-copy-key="04.stepTwoTitle" text-anchor="start" font-size="24" font-weight="700" fill="#29243e"><tspan x="148" y="601">You tick the checkbox.</tspan></text><text data-copy-key="04.stepTwoBody" text-anchor="start" font-size="21" font-weight="400" fill="#466453"><tspan x="148" y="632">Follow the visual demo.</tspan></text><circle cx="104" cy="691" r="23" fill="#6044ad"/><text text-anchor="middle" font-size="19" font-weight="700" fill="#e3ffed"><tspan x="104" y="698">3</tspan></text><text data-copy-key="04.stepThreeTitle" text-anchor="start" font-size="24" font-weight="700" fill="#29243e"><tspan x="148" y="694">You allow website access.</tspan></text><text data-copy-key="04.stepThreeBody" text-anchor="start" font-size="21" font-weight="400" fill="#466453"><tspan x="148" y="725">When Safari asks.</tspan></text><g id="settings-onboarding-ui" transform="translate(790 155) rotate(-6) scale(1.02)"><rect x="0" y="0" width="300" height="300" rx="20" fill="url(#card)" filter="url(#shadow)"/><rect x="133" y="9" width="34" height="3" rx="1.5" fill="#c0b6ca" /><circle cx="276" cy="20" r="12" fill="#e3dced"/><path d="m272 16 8 8m0-8-8 8" stroke="#655e72" stroke-width="1.2" stroke-linecap="round"/><text text-anchor="middle" font-size="8" font-weight="700" fill="#655e72"><tspan x="150" y="37">Short Video Blocker</tspan></text><text text-anchor="end" font-size="11" font-weight="400" fill="#655e72"><tspan x="246" y="38">2 / 4</tspan></text><text text-anchor="start" font-size="11" font-weight="400" fill="#655e72"><tspan x="18" y="38">Back</tspan></text><g transform="translate(126 58)"><rect x="0" y="0" width="48" height="48" rx="16" fill="#e6ddfa" stroke="#d7cfe3" /><path d="M12 14h24" stroke="#6044ad" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="14" r="3" fill="#faf8f4" stroke="#6044ad" stroke-width="2"/><path d="M12 24h24" stroke="#6044ad" stroke-width="2" stroke-linecap="round"/><circle cx="30" cy="24" r="3" fill="#faf8f4" stroke="#6044ad" stroke-width="2"/><path d="M12 34h24" stroke="#6044ad" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="34" r="3" fill="#faf8f4" stroke="#6044ad" stroke-width="2"/></g><text text-anchor="middle" font-size="20" font-weight="700" fill="#29243e"><tspan x="150" y="137">Open Safari</tspan><tspan x="150" y="160.4">settings</tspan></text><text text-anchor="middle" font-size="12" font-weight="400" fill="#655e72"><tspan x="150" y="189">We need the Extensions section.</tspan><tspan x="150" y="206">I’ll open it for you.</tspan></text><rect x="18" y="246" width="264" height="40" rx="12" fill="url(#button)" /><text text-anchor="middle" font-size="12" font-weight="650" fill="white"><tspan x="150" y="272">Open settings</tspan></text></g><g id="checkbox-onboarding-ui" transform="translate(856 337) scale(1.5)"><rect x="0" y="0" width="300" height="300" rx="20" fill="url(#card)" filter="url(#shadow)"/><rect x="133" y="9" width="34" height="3" rx="1.5" fill="#c0b6ca" /><circle cx="276" cy="20" r="12" fill="#e3dced"/><path d="m272 16 8 8m0-8-8 8" stroke="#655e72" stroke-width="1.2" stroke-linecap="round"/><text text-anchor="middle" font-size="8" font-weight="700" fill="#655e72"><tspan x="150" y="37">Short Video Blocker</tspan></text><text text-anchor="end" font-size="11" font-weight="400" fill="#655e72"><tspan x="246" y="38">3 / 4</tspan></text><text text-anchor="start" font-size="11" font-weight="400" fill="#655e72"><tspan x="18" y="38">Back</tspan></text><text text-anchor="middle" font-size="19" font-weight="700" fill="#29243e"><tspan x="150" y="76">One checkbox.</tspan><tspan x="150" y="98.2">A little more calm.</tspan></text><text text-anchor="middle" font-size="12" font-weight="400" fill="#655e72"><tspan x="150" y="120">In Safari extensions, find</tspan><tspan x="150" y="137">Short Video Blocker.</tspan></text><rect x="18" y="150" width="264" height="58" rx="13" fill="#ffffffb8" stroke="#d7cfe3" /><rect x="31" y="167" width="24" height="24" rx="6" fill="#6044ad" /><path d="M36 180 l4.9 4.9 l9.1 -10.92" fill="none" stroke="white" stroke-width="1.96" stroke-linecap="round" stroke-linejoin="round"/><image href="../../icon/ShortVideoBlocker-icon.png" x="65" y="165" width="28" height="28"/><text text-anchor="start" font-size="12" font-weight="650" fill="#29243e"><tspan x="104" y="176">Short Video</tspan><tspan x="104" y="191">Blocker</tspan></text><circle cx="43" cy="179" r="19" fill="none" stroke="#6044ad" stroke-width="1" opacity=".3"/><path d="M44 180v21l5.6-5.5 4.9 10.5 4.5-2.2-4.9-10.1H62Z" fill="#29243e" stroke="#faf8f4" stroke-width="1.5" stroke-linejoin="round"/><text text-anchor="start" font-size="11" font-weight="400" fill="#655e72"><tspan x="18" y="226">Tick the checkbox in Safari.</tspan></text><text text-anchor="end" font-size="11" font-weight="650" fill="#6044ad"><tspan x="278" y="226">Pause</tspan></text><rect x="18" y="246" width="264" height="40" rx="12" fill="url(#button)" /><text text-anchor="middle" font-size="12" font-weight="650" fill="white"><tspan x="150" y="272">It’s checked. Let’s continue</tspan></text></g>
<rect x="80" y="844" width="38" height="5" rx="2.5" fill="#adc8b5" /><rect x="130" y="844" width="38" height="5" rx="2.5" fill="#6044ad" /><text text-anchor="end" font-size="16" font-weight="500" fill="#e1d6f2"><tspan x="1360" y="850">2 / 2</tspan></text>
