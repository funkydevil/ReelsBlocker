<g id="brand"><image href="../../icon/ShortVideoBlocker-icon.png" x="76" y="47" width="54" height="54"/><text data-copy-key="appName" text-anchor="start" font-size="24" font-weight="700" fill="#ffffff"><tspan x="145" y="82">Short Video Blocker</tspan></text><text data-copy-key="platform" text-anchor="end" font-size="14" font-weight="600" fill="#e1d6f2"><tspan x="1360" y="80">FOR SAFARI ON MAC</tspan></text></g>
